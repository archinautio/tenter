name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # git-cliff needs the earlier tags to find where this release starts.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Check that the tag matches the project version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and package the release
        run: ./gradlew build :tenter-example:packagedSmoke :tenter:publishToMavenLocal
      - name: Find the previous release
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          # Before the first release, the notes start at the initial commit.
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          echo "CHANGES_SINCE=${previous:-$(git rev-list --max-parents=0 HEAD)}" >> "$GITHUB_ENV"
      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --strip header ${{ env.CHANGES_SINCE }}..${{ github.ref_name }}
        env:
          OUTPUT: build/changes.md
      - name: Add the public API changes and the full changelog link
        run: |
          ./gradlew reportApiChanges -PapiNotes=build/api-notes.md
          {
            cat build/changes.md
            echo
            cat build/api-notes.md
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_REF_NAME"
            fi
          } > build/release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Tenter $VERSION" \
            --notes-file build/release-notes.md \
            ~/.m2/repository/io/archinaut/tenter/"$VERSION"/tenter-"$VERSION"*
