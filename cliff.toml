# Release notes for one tag, built from Conventional Commits by git-cliff.
# Preview the notes of the latest tag: git cliff --latest --strip header

[changelog]
header = ""
body = """
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking %}
### Breaking changes 💥
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/archinautio/tenter/commit/{{ commit.id }}))\
{%- if commit.breaking_description and commit.breaking_description != commit.message %}
{%- set description = commit.breaking_description | replace(from="\n", to=" ") | upper_first %}
{# git-cliff trims leading spaces in the template, so the indent is a string. #}\
{{ "  " ~ description }}\
{%- endif %}
{%- endfor %}
{% endif -%}
{%- for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
{#- The Dependency updates heading already says what the deps scope would. #}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/archinautio/tenter/commit/{{ commit.id }}))
{%- endfor %}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Breaking commits stay in the notes even when their type is skipped below.
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The HTML comments only order the groups; they are stripped from the headings.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features ⭐" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes 🐞" },
  { message = "^perf", group = "<!-- 2 -->Performance ⚡" },
  # Only dependencies callers get; build tooling bumps stay plain build commits.
  { message = "^build\\(deps\\)", group = "<!-- 3 -->Dependency updates 🚀" },
  { message = "^docs", group = "<!-- 4 -->Documentation 📖" },
  { message = ".*", skip = true },
]
